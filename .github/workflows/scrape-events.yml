name: Scrape Disney Events

on:
  schedule:
    - cron: '0 8 * * 1'  # Every Monday at 8am UTC
  workflow_dispatch:       # Allow manual trigger

permissions:
  contents: write
  issues: write   # open an issue when events are added/removed

concurrency:
  group: scrape-events
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Test scraper parsing
        run: python3 -B -m unittest discover -s tests

      - name: Save previously published data (for the change report)
        run: git show origin/data:events-data.json > old-events-data.json || echo "No previous data branch yet"

      - name: Run scraper
        env:
          EVENT_URL: ${{ vars.EVENT_URL }}
          OLD_EVENTS: old-events-data.json
        run: python3 scrape-events.py

      - name: Push data to orphan branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan data-tmp
          git reset
          git add -f events-data.json
          git commit -m "Update events-data.json"
          git push origin data-tmp:data --force
          git checkout -f main
          git branch -D data-tmp

      - name: Change report in run summary
        if: always() && hashFiles('scrape-report.md') != ''
        run: cat scrape-report.md >> "$GITHUB_STEP_SUMMARY"

      # GitHub emails you about new issues (if your notification settings allow). Only fires when an
      # event we publish is added or removed, never for reworded page text.
      - name: Open issue when events are added or removed
        if: hashFiles('scrape-notable.flag') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Events data changed ($(date -u +%F))" --body-file scrape-report.md

      # Optional: needs repo secrets PUSHOVER_APP_TOKEN and PUSHOVER_USER_KEY; silently skipped if unset.
      - name: Notify on failure (Pushover)
        if: failure()
        env:
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$PUSHOVER_APP_TOKEN" ] || [ -z "$PUSHOVER_USER_KEY" ]; then
            echo "Pushover secrets not set; skipping notification"; exit 0
          fi
          curl -sS --max-time 15 \
            --form-string "token=$PUSHOVER_APP_TOKEN" \
            --form-string "user=$PUSHOVER_USER_KEY" \
            --form-string "title=Disney events scrape failed" \
            --form-string "message=The weekly events scrape failed. Events data was NOT updated." \
            --form-string "url=$RUN_URL" \
            https://api.pushover.net/1/messages.json
